<!DOCTYPE html><html><head><title>RateReflex - Order</title><style>body{margin:0;padding:0;font-family:"Segoe UI",sans-serif;background:linear-gradient(135deg,#ff4d4d 0%,#ffcc00 100%);min-height:100vh;display:flex;flex-direction:column;align-items:center}nav{width:100%;background:linear-gradient(90deg,#ff4d4d,#ffcc00);padding:15px 40px;display:flex;align-items:center;border-bottom:3px solid #000;box-sizing:border-box}.nav-links a{color:#000;text-decoration:none;font-weight:700;padding:8px 16px;border:3px solid #000;border-radius:8px;background:#ffeb3b;margin-right:10px;box-shadow:3px 3px 0px #000}.content{padding:40px;max-width:1000px;text-align:center}h1{font-size:2.5rem;background:#fff;padding:10px 20px;border:4px solid #000;box-shadow:8px 8px 0px #000;display:inline-block;margin-bottom:40px}.dish-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:30px}.dish-card{background:#fff;border:3px solid #000;border-radius:15px;padding:20px;box-shadow:7px 7px 0px #000;transition:0.2s}.dish-card img{width:100%;height:180px;object-fit:cover;border:3px solid #000;border-radius:10px;background:#eee}.dish-name{font-size:1.5rem;font-weight:800;margin:15px 0 10px;text-transform:uppercase}.stars{display:flex;justify-content:center;gap:5px;cursor:pointer}.star{font-size:2rem;color:#ccc;transition:0.1s;text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000}.star.active{color:#ffeb3b}</style></head><body><nav><div class="nav-links"><a href="dashboard.html">Home</a><a href="order.html">Order</a><a href="wallet.html">Wallet</a></div></nav><div class="content"><h1>Rate Our Delicacies</h1><div class="dish-grid"><div class="dish-card"><img src="https://via.placeholder.com/250x180?text=Spiced+Ramen" alt="Dish"><div class="dish-name">Spiced Ramen</div><div class="stars" data-rating="0"><span class="star" onclick="rate(this,1)">★</span><span class="star" onclick="rate(this,2)">★</span><span class="star" onclick="rate(this,3)">★</span><span class="star" onclick="rate(this,4)">★</span><span class="star" onclick="rate(this,5)">★</span></div></div><div class="dish-card"><img src="https://via.placeholder.com/250x180?text=Truffle+Pasta" alt="Dish"><div class="dish-name">Truffle Pasta</div><div class="stars" data-rating="0"><span class="star" onclick="rate(this,1)">★</span><span class="star" onclick="rate(this,2)">★</span><span class="star" onclick="rate(this,3)">★</span><span class="star" onclick="rate(this,4)">★</span><span class="star" onclick="rate(this,5)">★</span></div></div><div class="dish-card"><img src="https://via.placeholder.com/250x180?text=Steak+Frites" alt="Dish"><div class="dish-name">Steak Frites</div><div class="stars" data-rating="0"><span class="star" onclick="rate(this,1)">★</span><span class="star" onclick="rate(this,2)">★</span><span class="star" onclick="rate(this,3)">★</span><span class="star" onclick="rate(this,4)">★</span><span class="star" onclick="rate(this,5)">★</span></div></div></div></div><script>function rate(el,rating){const parent=el.parentElement;const stars=parent.querySelectorAll(".star");stars.forEach((s,i)=>{s.classList.toggle("active",i<rating)});parent.setAttribute("data-rating",rating);console.log("Rated "+rating+" stars")}</script></body></html>
