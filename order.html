<!DOCTYPE html><html><head><title>RateReflex - Order</title><style>body{margin:0;padding:0;font-family:"Segoe UI",sans-serif;background:linear-gradient(135deg,#ff4d4d 0%,#ffcc00 100%);min-height:100vh}nav{background:linear-gradient(90deg,#ff4d4d,#ffcc00);padding:15px 40px;display:flex;align-items:center;border-bottom:3px solid #000;position:sticky;top:0;z-index:1000}.nav-links a{color:#000;text-decoration:none;font-weight:700;padding:8px 16px;border:3px solid #000;border-radius:8px;background:#ffeb3b;box-shadow:3px 3px 0px #000}.content{padding:20px;max-width:1400px;margin:0 auto}.dish-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:25px;padding-top:20px}.dish-card{background:#fff;border:3px solid #000;border-radius:15px;padding:15px;box-shadow:6px 6px 0px #000;transition:0.2s;text-align:center}.dish-card img{width:100%;height:180px;object-fit:cover;border:3px solid #000;border-radius:10px;background:#eee}.dish-name{font-size:1.2rem;font-weight:800;margin:12px 0 8px;text-transform:uppercase}.stars{display:flex;justify-content:center;gap:5px;cursor:pointer}.star{font-size:2rem;color:#ccc;text-shadow:1px 1px 0 #000}.star.active{color:#ffeb3b}</style></head><body><nav><div class="nav-links"><a href="dashboard.html">Home</a></div></nav><div class="content"><div class="dish-grid" id="main-grid"></div></div><script>const dishes=["Spiced Ramen","Truffle Pasta","Neon Steak","Zesty Tacos","Glazed Salmon","BBQ Ribs","Veggie Burger","Sushi Roll","Greek Salad","Butter Chicken","Dim Sum","Lobster Roll","Philly Cheese","Margherita Pizza","Peking Duck","Pad Thai","Fish & Chips","Falafel Wrap","Beef Wellington","Street Corn","Clam Chowder","Bibimbap","Chicken Adobo","Paella","Miso Soup","Gyoza","Lasagna","Risotto","Enchiladas","Kebab","Poke Bowl","French Onion Soup","Ratatouille","Quiche","Carbonara","Tiramisu","Gelato","Cannoli","Cheesecake","Apple Pie","Baklava","Churros","Donuts","Waffles","Pancakes","Eggs Benedict","Avocado Toast","Smoothie Bowl","Acai Bowl","Fruit Tart"];const grid=document.getElementById("main-grid");dishes.forEach((name,index)=>{const card=document.createElement("div");card.className="dish-card";card.innerHTML=`<img src="https://picsum.photos/seed/${index+20}/300/200" alt="Dish"><div class="dish-name">${name}</div><div class="stars" onclick="rate(event)">${"<span>★</span>".repeat(5).replace(/<span>/g,"<span class=\"star\">")}</div>`;grid.appendChild(card)});function rate(e){if(e.target.classList.contains("star")){const stars=Array.from(e.currentTarget.children);const idx=stars.indexOf(e.target);stars.forEach((s,i)=>s.classList.toggle("active",i<=idx))}}</script></body></html>
