<!DOCTYPE html><html><head><title>RateReflex - Delicacies</title><style>
body{margin:0;font-family:"Segoe UI",sans-serif;background:linear-gradient(135deg,#ff4d4d,#ffcc00);min-height:100vh}
nav{background:linear-gradient(90deg,#ff4d4d,#ffcc00);padding:15px 40px;display:flex;border-bottom:3px solid #000;position:sticky;top:0;z-index:1000}
.nav-links a{color:#000;text-decoration:none;font-weight:700;padding:8px 16px;border:3px solid #000;border-radius:8px;background:#ffeb3b;box-shadow:3px 3px 0px #000;margin-right:10px}
.container{padding:20px;max-width:1200px;margin:0 auto;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:25px;padding-top:20px}
.card{background:#fff;border:3px solid #000;border-radius:15px;padding:15px;box-shadow:8px 8px 0px #000;text-align:left;cursor:pointer;transition:0.3s}
.card:hover{transform:translateY(-5px)}.card img{width:100%;height:180px;object-fit:cover;border:3px solid #000;border-radius:10px}
.dish-title{font-size:1.3rem;font-weight:900;margin:10px 0;text-transform:uppercase}
.price{background:#ff4d4d;color:#fff;padding:2px 8px;font-weight:700;border:2px solid #000;display:inline-block;margin-bottom:10px}
.tag-container{display:flex;gap:5px;flex-wrap:wrap}.tag{background:#ffeb3b;padding:4px 8px;font-size:0.7rem;font-weight:700;border:2px solid #000;border-radius:5px}
.modal{display:none;position:fixed;z-index:2000;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,0.8)}
.modal-content{background:#fff;margin:5% auto;padding:25px;max-width:600px;border:4px solid #000;border-radius:15px;box-shadow:10px 10px 0px #000;position:relative}
.close{position:absolute;top:10px;right:20px;font-size:30px;font-weight:900;cursor:pointer}
.modal-img{width:100%;height:300px;object-fit:cover;border:3px solid #000;border-radius:10px;margin-bottom:15px}
.info-label{font-weight:900;color:#ff4d4d}
</style></head><body>
<nav><div class="nav-links"><a href="dashboard.html">Home</a><a href="delicacies.html">Delicacies</a><a href="order.html">Order</a></div></nav>
<div class="container"><div class="grid" id="dish-grid"></div></div>
<div id="dishModal" class="modal"><div class="modal-content"><span class="close">&times;</span><div id="modalBody"></div></div></div>
<script>
const dishData=[
{n:"Pasta Carbonara",p:18,d:"Guanciale, eggs, Pecorino",c:"Italy",img:"https://www.recipetineats.com/wp-content/uploads/2019/07/Carbonara_1.jpg",t:["ITALIAN"]},
{n:"Sushi",p:35,d:"Rice, raw fish, nori",c:"Japan",img:"https://www.recipetineats.com/wp-content/uploads/2020/09/Sushi_2.jpg",t:["JAPANESE"]},
{n:"Pizza Margherita",p:16,d:"Tomato, mozzarella, basil",c:"Italy",img:"https://www.recipetineats.com/wp-content/uploads/2020/05/Pizza_2.jpg",t:["ITALIAN"]},
{n:"Tacos al Pastor",p:12,d:"Pork, pineapple, onion",c:"Mexico",img:"https://www.recipetineats.com/wp-content/uploads/2020/06/Tacos-Al-Pastor_2.jpg",t:["MEXICAN"]},
{n:"Samosas",p:8,d:"Pastry, potato, peas",c:"India",img:"https://www.recipetineats.com/wp-content/uploads/2019/04/Samosas_2.jpg",t:["INDIAN"]},
{n:"Chiles Rellenos",p:16,d:"Poblano, cheese, batter",c:"Mexico",img:"https://www.recipetineats.com/wp-content/uploads/2023/01/Chiles-Rellenos_5.jpg",t:["MEXICAN"]}
];
const grid=document.getElementById("dish-grid"),modal=document.getElementById("dishModal"),modalBody=document.getElementById("modalBody"),closeBtn=document.querySelector(".close");
function createCard(e){const n=document.createElement("div");n.className="card";n.innerHTML=`<img src="${e.img}"><div class="dish-title">${e.n}</div><div class="price">$${e.p}</div><div>${e.d}</div><div class="tag-container">${e.t.map(t=>`<span class="tag">${t}</span>`).join("")}</div>`;n.onclick=()=>showModal(e);grid.appendChild(n)}
function showModal(e){modalBody.innerHTML=`<img src="${e.img}" class="modal-img"><h2>${e.n}</h2><p><span class="info-label">ORIGIN:</span> ${e.c}</p><p>${e.d}</p>`;modal.style.display="block"}
dishData.forEach(createCard);
closeBtn.onclick=()=>modal.style.display="none";
window.onclick=e=>{if(e.target==modal)modal.style.display="none"};
</script></body></html>
