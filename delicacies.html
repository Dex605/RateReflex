<!DOCTYPE html><html><head><title>RateReflex - Delicacies</title><style>body{margin:0;padding:0;font-family:"Segoe UI",sans-serif;background:linear-gradient(135deg,#ff4d4d 0%,#ffcc00 100%);min-height:100vh}nav{background:linear-gradient(90deg,#ff4d4d,#ffcc00);padding:15px 40px;display:flex;align-items:center;border-bottom:3px solid #000;position:sticky;top:0;z-index:1000}.nav-links a{color:#000;text-decoration:none;font-weight:700;padding:8px 16px;border:3px solid #000;border-radius:8px;background:#ffeb3b;box-shadow:3px 3px 0px #000}.container{padding:20px;max-width:1400px;margin:0 auto;text-align:center}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:30px;padding-top:20px}.card{background:#fff;border:3px solid #000;border-radius:15px;padding:20px;box-shadow:8px 8px 0px #000;text-align:left;display:flex;flex-direction:column}.card img{width:100%;height:200px;object-fit:cover;border:3px solid #000;border-radius:10px}.dish-title{font-size:1.4rem;font-weight:900;margin:15px 0 5px;text-transform:uppercase}.price{background:#ff4d4d;color:#fff;padding:2px 8px;font-weight:700;border:2px solid #000;display:inline-block;margin-bottom:10px;width:fit-content}.details{font-size:0.95rem;line-height:1.4;color:#333;margin-bottom:15px;flex-grow:1}.tag-container{display:flex;gap:5px;flex-wrap:wrap}.tag{background:#ffeb3b;padding:4px 10px;font-size:0.75rem;font-weight:700;border:2px solid #000;border-radius:5px}</style></head><body><nav><div class="nav-links"><a href="dashboard.html">Home</a><a href="delicacies.html">Delicacies</a><a href="order.html">Order</a><a href="wallet.html">Wallet</a></div></nav><div class="container"><div class="grid" id="dish-grid"></div></div><script>const dishData=[{n:"Midnight Ramen",p:18,d:"12-hour pork broth with marinated egg.",t:["SPICY"]},{n:"Pesto Paradiso",p:22,d:"Hand-rolled linguine with fresh basil pesto.",t:["VEGGIE"]},{n:"Neon Ribeye",p:35,d:"Dry-aged steak with truffle-salted fries.",t:["PREMIUM"]},{n:"Zesty Salmon",p:28,d:"Pan-seared salmon with lemon-dill butter.",t:["FRESH"]}];const grid=document.getElementById("dish-grid");for(let i=0;i<100;i++){const data=dishData[i%dishData.length];const card=document.createElement("div");card.className="card";card.innerHTML=`<img src="https://picsum.photos/seed/${i+50}/400/300" alt="Dish"><div class="dish-title">${data.n} #${i+1}</div><div class="price">$${data.p+i%5}.00</div><p class="details">${data.d} A signature delicacy prepared with the finest ingredients from our kitchen.</p><div class="tag-container">${data.t.map(tag=>`<span class="tag">${tag}</span>`).join("")}<span class="tag">TOP RATED</span></div>`;grid.appendChild(card)}</script></body></html>
