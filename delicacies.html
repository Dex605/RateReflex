<!DOCTYPE html><html><head><title>RateReflex - Delicacies</title><style>body{margin:0;padding:0;font-family:"Segoe UI",sans-serif;background:linear-gradient(135deg,#ff4d4d 0%,#ffcc00 100%);min-height:100vh}nav{background:linear-gradient(90deg,#ff4d4d,#ffcc00);padding:15px 40px;display:flex;align-items:center;border-bottom:3px solid #000;position:sticky;top:0;z-index:1000}.nav-links a{color:#000;text-decoration:none;font-weight:700;padding:8px 16px;border:3px solid #000;border-radius:8px;background:#ffeb3b;box-shadow:3px 3px 0px #000}.container{padding:20px;max-width:1400px;margin:0 auto;text-align:center}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:30px;padding-top:20px}.card{background:#fff;border:3px solid #000;border-radius:15px;padding:20px;box-shadow:8px 8px 0px #000;text-align:left;display:flex;flex-direction:column}.card img{width:100%;height:200px;object-fit:cover;border:3px solid #000;border-radius:10px}.dish-title{font-size:1.4rem;font-weight:900;margin:15px 0 5px;text-transform:uppercase}.price{background:#ff4d4d;color:#fff;padding:2px 8px;font-weight:700;border:2px solid #000;display:inline-block;margin-bottom:10px;width:fit-content}.details{font-size:0.95rem;line-height:1.4;color:#333;margin-bottom:15px;flex-grow:1}.tag-container{display:flex;gap:5px;flex-wrap:wrap}.tag{background:#ffeb3b;padding:4px 10px;font-size:0.75rem;font-weight:700;border:2px solid #000;border-radius:5px}</style></head><body><nav><div class="nav-links"><a href="dashboard.html">Home</a><a href="delicacies.html">Delicacies</a><a href="order.html">Order</a><a href="wallet.html">Wallet</a></div></nav><div class="container"><div class="grid" id="dish-grid"></div></div><script>const dishData=[{n:"Pasta Carbonara",p:18,d:"Classic Roman pasta with crispy guanciale, egg yolk, Pecorino Romano cheese, and black pepper. Creamy without cream.",t:["ITALIAN","PASTA"],img:"https://www.recipetineats.com/wp-content/uploads/2019/07/Carbonara_1.jpg"},{n:"Paella Valenciana",p:28,d:"Traditional Spanish rice dish with saffron, chicken, rabbit, beans, and rosemary. Cooked in a wide shallow pan.",t:["SPANISH","SEAFOOD"],img:"https://www.recipetineats.com/wp-content/uploads/2016/05/Seafood-Paella_1.jpg"},{n:"Coq au Vin",p:32,d:"French chicken braised in red wine with mushrooms, pearl onions, bacon, and aromatic herbs. Rich and hearty.",t:["FRENCH","PREMIUM"],img:"https://www.recipetineats.com/wp-content/uploads/2019/01/Coq-au-Vin_7.jpg"},{n:"Beef Wellington",p:45,d:"Tender beef fillet coated with mushroom duxelles and pâté, wrapped in golden puff pastry. British elegance.",t:["BRITISH","PREMIUM"],img:"https://www.recipetineats.com/wp-content/uploads/2019/12/Beef-Wellington_5.jpg"},{n:"Moussaka",p:24,d:"Greek layered casserole with eggplant, spiced meat sauce, béchamel, and cheese. Baked to golden perfection.",t:["GREEK","BAKED"],img:"https://www.recipetineats.com/wp-content/uploads/2018/09/Moussaka_3.jpg"},{n:"Wiener Schnitzel",p:26,d:"Breaded and fried veal cutlet from Austria. Served with lemon wedge, potato salad, and lingonberry jam.",t:["AUSTRIAN","CRISPY"],img:"https://www.recipetineats.com/wp-content/uploads/2020/02/Schnitzel_1.jpg"},{n:"Moroccan Tagine",p:30,d:"Slow-cooked lamb stew with apricots, almonds, and aromatic spices like cumin, cinnamon, and saffron.",t:["MOROCCAN","SPICY"],img:"https://www.recipetineats.com/wp-content/uploads/2020/04/Moroccan-Lamb-Tagine_2.jpg"},{n:"Ethiopian Doro Wat",p:25,d:"Spicy chicken stew with berbere spices and boiled eggs. Served on injera flatbread for scooping.",t:["ETHIOPIAN","SPICY"],img:"https://www.196flavors.com/wp-content/uploads/2014/10/doro-wat-4.jpg"},{n:"South African Bobotie",p:22,d:"Curried minced meat bake topped with savory egg custard. Served with yellow rice and chutney.",t:["SOUTH AFRICAN","SPICY"],img:"https://www.recipetineats.com/wp-content/uploads/2020/08/Bobotie_2.jpg"},{n:"Bunny Chow",p:16,d:"South African street food - hollowed-out loaf of bread filled with spicy curry. Durban's iconic dish.",t:["SOUTH AFRICAN","STREET FOOD"],img:"https://www.196flavors.com/wp-content/uploads/2016/07/bunny-chow-2.jpg"},{n:"Jollof Rice",p:20,d:"West African one-pot rice dish cooked in rich tomato sauce with spices, vegetables, and your choice of protein.",t:["WEST AFRICAN","POPULAR"],img:"https://www.recipetineats.com/wp-content/uploads/2016/09/Jollof-Rice_1.jpg"},{n:"Peri-Peri Chicken",p:24,d:"Mozambican grilled chicken marinated in fiery peri-peri chili sauce. Smoky, spicy, and addictive.",t:["MOZAMBICAN","GRILLED"],img:"https://www.recipetineats.com/wp-content/uploads/2019/08/Peri-Peri-Chicken_2.jpg"},{n:"Suya",p:18,d:"Nigerian grilled meat skewers coated in spicy peanut spice mix. Popular West African street food.",t:["NIGERIAN","GRILLED"],img:"https://www.196flavors.com/wp-content/uploads/2014/09/suya-4.jpg"},{n:"Shakshuka",p:16,d:"North African eggs poached in spicy tomato sauce with peppers, cumin, and paprika. Perfect for brunch.",t:["NORTH AFRICAN","BREAKFAST"],img:"https://www.recipetineats.com/wp-content/uploads/2016/02/Shakshuka_1.jpg"},{n:"Couscous Royale",p:28,d:"Moroccan steamed couscous served with seven vegetables and assorted meats. A festive centerpiece.",t:["MOROCCAN","TRADITIONAL"],img:"https://www.196flavors.com/wp-content/uploads/2015/02/couscous-royal-3.jpg"},{n:"Biltong",p:14,d:"South African dried, cured meat snack made from beef, game, or ostrich. High protein, zero carbs.",t:["SOUTH AFRICAN","SNACK"],img:"https://www.196flavors.com/wp-content/uploads/2017/01/biltong-3.jpg"}];const grid=document.getElementById("dish-grid");dishData.forEach((data,i)=>{const card=document.createElement("div");card.className="card";card.innerHTML=`<img src="${data.img}" alt="${data.n}" onerror="this.src='https://via.placeholder.com/400x300/ff4d4d/ffffff?text=${encodeURIComponent(data.n)}'"><div class="dish-title">${data.n}</div><div class="price">$${data.p}.00</div><p class="details">${data.d}</p><div class="tag-container">${data.t.map(tag=>`<span class="tag">${tag}</span>`).join("")}<span class="tag">TOP RATED</span></div>`;grid.appendChild(card)})</script></body></html>
