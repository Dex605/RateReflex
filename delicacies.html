<!DOCTYPE html><html><head><title>RateReflex - Delicacies</title><style>body{margin:0;padding:0;font-family:"Segoe UI",sans-serif;background:linear-gradient(135deg,#ff4d4d 0%,#ffcc00 100%);min-height:100vh}nav{background:linear-gradient(90deg,#ff4d4d,#ffcc00);padding:15px 40px;display:flex;align-items:center;border-bottom:3px solid #000;position:sticky;top:0;z-index:1000}.nav-links a{color:#000;text-decoration:none;font-weight:700;padding:8px 16px;border:3px solid #000;border-radius:8px;background:#ffeb3b;box-shadow:3px 3px 0px #000;margin-right:10px}.container{padding:20px;max-width:1400px;margin:0 auto;text-align:center}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:30px;padding-top:20px}.card{background:#fff;border:3px solid #000;border-radius:15px;padding:20px;box-shadow:8px 8px 0px #000;text-align:left;display:flex;flex-direction:column;cursor:pointer;transition:transform 0.3s}.card:hover{transform:translateY(-5px)}.card img{width:100%;height:200px;object-fit:cover;border:3px solid #000;border-radius:10px}.dish-title{font-size:1.4rem;font-weight:900;margin:15px 0 5px;text-transform:uppercase}.price{background:#ff4d4d;color:#fff;padding:2px 8px;font-weight:700;border:2px solid #000;display:inline-block;margin-bottom:10px;width:fit-content}.details{font-size:0.95rem;line-height:1.4;color:#333;margin-bottom:15px;flex-grow:1}.tag-container{display:flex;gap:5px;flex-wrap:wrap}.tag{background:#ffeb3b;padding:4px 10px;font-size:0.75rem;font-weight:700;border:2px solid #000;border-radius:5px}.modal{display:none;position:fixed;z-index:2000;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,0.8);overflow-y:auto}.modal-content{background:#fff;margin:50px auto;padding:30px;max-width:800px;border:4px solid #000;border-radius:15px;box-shadow:12px 12px 0px #000;position:relative}.close{position:absolute;top:15px;right:20px;font-size:35px;font-weight:900;color:#000;cursor:pointer;border:none;background:none}.close:hover{color:#ff4d4d}.modal-img{width:100%;height:400px;object-fit:cover;border:3px solid #000;border-radius:10px;margin-bottom:20px}.modal-title{font-size:2rem;font-weight:900;margin-bottom:15px;text-transform:uppercase}.modal-info{font-size:1.1rem;line-height:1.8;color:#333}.info-section{margin-bottom:20px}.info-label{font-weight:900;color:#ff4d4d;margin-bottom:5px}</style></head><body><nav><div class="nav-links"><a href="dashboard.html">Home</a><a href="delicacies.html">Delicacies</a><a href="order.html">Order</a><a href="wallet.html">Wallet</a></div></nav><div class="container"><div class="grid" id="dish-grid"></div></div><div id="dishModal" class="modal"><div class="modal-content"><span class="close">&times;</span><div id="modalBody"></div></div></div><script>const dishData=[{n:"Pasta Carbonara",p:18,d:"Guanciale, eggs, Pecorino Romano, black pepper",country:"Italy",full:"A classic Roman pasta dish made with cured pork cheek (guanciale), egg yolks, Pecorino Romano cheese, and freshly cracked black pepper. The heat from the pasta creates a creamy sauce without any cream. Beloved in Italy and worldwide.",t:["ITALIAN","PASTA"],img:"https://www.recipetineats.com/wp-content/uploads/2019/07/Carbonara_1.jpg"}];const grid=document.getElementById("dish-grid");const modal=document.getElementById("dishModal");const modalBody=document.getElementById("modalBody");const closeBtn=document.querySelector(".close");dishData.forEach((data,i)=>{const card=document.createElement("div");card.className="card";card.innerHTML=`<img src="${data.img}" alt="${data.n}"><div class="dish-title">${data.n}</div><div class="price">$${data.p}.00</div><p class="details">${data.d}</p><div class="tag-container">${data.t.map(tag=>`<span class="tag">${tag}</span>`).join("")}</div>`;card.onclick=function(){modalBody.innerHTML=`<img src="${data.img}" alt="${data.n}" class="modal-img"><div class="modal-title">${data.n}</div><div class="modal-info"><div class="info-section"><div class="info-label">🌍 POPULAR IN:</div>${data.country}</div><div class="info-section"><div class="info-label">📝 MAIN INGREDIENTS:</div>${data.d}</div><div class="info-section"><div class="info-label">💰 PRICE:</div>$${data.p}.00</div><div class="info-section"><div class="info-label">📖 ABOUT THIS DISH:</div>${data.full}</div></div>`;modal.style.display="block"};grid.appendChild(card)});closeBtn.onclick=function(){modal.style.display="none"};window.onclick=function(event){if(event.target==modal){modal.style.display="none"}}</script></body></html>
