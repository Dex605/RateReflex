<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            background: linear-gradient(180deg, #323564 0%, #1c1b33 100%);
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        nav {
            padding: 25px;
            display: flex;
            gap: 40px;
            font-size: 0.85rem;
            opacity: 0.6;
        }
        .active { opacity: 1; font-weight: bold; }
        .container {
            width: 90%;
            max-width: 600px;
            margin-top: 50px;
        }
        .wallet-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }
        .glass-item {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
        }
        .label {
            font-size: 0.7rem;
            opacity: 0.5;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .value {
            font-size: 1.2rem;
            font-weight: 300;
        }
        .actions {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 12px 40px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 0.9rem;
            transition: 0.3s;
            cursor: pointer;
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <nav>
        <span>Home</span><span>Delicacies</span><span>Orders</span><span class="active">Wallet</span>
    </nav>
    <div class="container">
        <div class="wallet-grid">
            <div class="glass-item"><div class="label">Bonus</div><div class="value">$0</div></div>
            <div class="glass-item"><div class="label">Earnings</div><div class="value">$0</div></div>
            <div class="glass-item"><div class="label">Ratings</div><div class="value">0</div></div>
            <div class="glass-item"><div class="label">Balance</div><div class="value">$0</div></div>
            <div class="glass-item"><div class="label">Withdrawal</div><div class="value">$0</div></div>
            <div class="glass-item"><div class="label">Pending</div><div class="value">$0</div></div>
        </div>
        <div class="actions">
            <button class="btn">Withdraw</button>
            <button class="btn">Deposit</button>
        </div>
    </div>
</body>
</html>
