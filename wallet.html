<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet - RateReflex</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(180deg, #3d3d7e 0%, #1a1a35 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        nav {
            width: 100%;
            padding: 20px 0;
            display: flex;
            justify-content: center;
            gap: 30px;
            font-size: 0.9rem;
            opacity: 0.8;
        }
        .container {
            width: 90%;
            max-width: 450px;
            margin-top: 50px;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }
        .balance-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            opacity: 0.6;
            margin-bottom: 10px;
        }
        .amount {
            font-size: 2.8rem;
            font-weight: 300;
            margin: 0 0 25px 0;
        }
        .btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 25px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 0.9rem;
            transition: 0.3s;
        }
        .btn:hover { background: rgba(255, 255, 255, 0.25); }
        .transactions {
            margin-top: 30px;
            width: 100%;
        }
        .trans-item {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.9rem;
        }
        .trans-item:last-child { border-bottom: none; }
        .m-neg { color: #ff6b6b; }
        .m-pos { color: #51cf66; }
    </style>
</head>
<body>
    <nav>
        <span>Home</span>
        <span>Delicacies</span>
        <span>Orders</span>
        <span style="font-weight: bold;">Wallet</span>
    </nav>
    <div class="container">
        <div class="glass-card">
            <div class="balance-label">Current Balance</div>
            <h1 class="amount">$1,284.50</h1>
            <a href="#" class="btn">Add Funds</a>
        </div>
        <div class="transactions">
            <div class="trans-item"><span>Sushi Platter</span><span class="m-neg">-$45.00</span></div>
            <div class="trans-item"><span>Wallet Top-up</span><span class="m-pos">+$200.00</span></div>
            <div class="trans-item"><span>Italian Pasta</span><span class="m-neg">-$18.20</span></div>
        </div>
    </div>
</body>
</html>
