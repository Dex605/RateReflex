<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet - RateReflex</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background: linear-gradient(180deg, #3d3d7e 0%, #1a1a35 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        nav {
            width: 100%;
            padding: 30px 0;
            display: flex;
            justify-content: center;
            gap: 30px;
            font-size: 0.9rem;
            opacity: 0.7;
        }
        .container {
            width: 90%;
            max-width: 400px;
            margin-top: 40px;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 20px;
            text-align: center;
        }
        .balance-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.5;
            margin-bottom: 8px;
        }
        .amount {
            font-size: 3rem;
            font-weight: 300;
            margin: 0 0 30px 0;
        }
        .btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 12px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 0.85rem;
        }
        .transactions {
            margin-top: 40px;
            width: 100%;
        }
        .trans-item {
            display: flex;
            justify-content: space-between;
            padding: 18px 5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.85rem;
        }
        .m-neg { color: #ff8e8e; }
        .m-pos { color: #8effa9; }
    </style>
</head>
<body>
    <nav>
        <span>Home</span>
        <span>Delicacies</span>
        <span>Orders</span>
        <span style="border-bottom: 1px solid white;">Wallet</span>
    </nav>
    <div class="container">
        <div class="glass-card">
            <div class="balance-label">Available Balance</div>
            <h1 class="amount">$2,500.00</h1>
            <a href="#" class="btn">Top Up Wallet</a>
        </div>
        <div class="transactions">
            <div class="trans-item"><span>Bank Transfer</span><span class="m-pos">+$500.00</span></div>
            <div class="trans-item"><span>Platform Credit</span><span class="m-pos">+$10.00</span></div>
            <div class="trans-item"><span>Withdrawal</span><span class="m-neg">-$150.00</span></div>
        </div>
    </div>
</body>
</html>
