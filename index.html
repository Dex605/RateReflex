<!DOCTYPE html><html><head><title>RateReflex</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:"Segoe UI",sans-serif;overflow-x:hidden}nav{position:fixed;top:0;width:100%;display:flex;justify-content:space-between;align-items:center;padding:20px 40px;background:rgba(102,126,234,0.95);backdrop-filter:blur(10px);z-index:1000;border-bottom:2px solid rgba(255,255,255,0.2)}.logo-container{display:flex;align-items:center;gap:10px}.logo-container img{height:40px;width:40px;border-radius:50%}.logo-container span{font-size:24px;font-weight:900;color:#fff}.auth-buttons{display:flex;gap:15px}.auth-buttons a{text-decoration:none;padding:10px 30px;border-radius:25px;font-weight:700;transition:all 0.3s}.signin{background:transparent;color:#fff;border:2px solid #fff}.signin:hover{background:#fff;color:#667eea}.signup{background:#fff;color:#667eea;border:2px solid #fff}.signup:hover{transform:translateY(-2px);box-shadow:0 5px 15px rgba(255,255,255,0.3)}.hero{position:relative;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}.bg-slider{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1}.bg-slider img{position:absolute;width:100%;height:100%;object-fit:cover;opacity:0;animation:zoom 24s infinite}@keyframes zoom{0%,100%{transform:scale(1);opacity:0}8.33%,25%{opacity:1}33.33%{transform:scale(1.3);opacity:0}}.bg-slider img:nth-child(1){animation-delay:0s}.bg-slider img:nth-child(2){animation-delay:8s}.bg-slider img:nth-child(3){animation-delay:16s}.overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,rgba(102,126,234,0.3) 0%,rgba(118,75,162,0.3) 100%);z-index:2}.content{position:relative;z-index:3;text-align:center;color:#fff;padding:20px}.content h1{font-size:72px;font-weight:900;margin-bottom:20px;text-shadow:3px 3px 6px rgba(0,0,0,0.5);letter-spacing:2px}.content p{font-size:28px;font-weight:300;opacity:0.95;text-shadow:2px 2px 4px rgba(0,0,0,0.5)}@media(max-width:768px){.content h1{font-size:40px}.content p{font-size:18px}.auth-buttons{gap:10px}.auth-buttons a{padding:8px 20px;font-size:14px}nav{padding:15px 20px}}</style></head><body><nav><div class="logo-container"><img src="logo.png" alt="RR"><span>RateReflex</span></div><div class="auth-buttons"><a href="dashboard.html" class="signin">SIGN IN</a><a href="dashboard.html" class="signup">SIGN UP</a></div></nav><div class="hero"><div class="bg-slider"><img src="https://www.recipetineats.com/wp-content/uploads/2016/09/Jollof-Rice_1.jpg" alt="Jollof Rice"><img src="https://www.196flavors.com/wp-content/uploads/2014/10/doro-wat-4.jpg" alt="Doro Wat"><img src="https://www.recipetineats.com/wp-content/uploads/2020/08/Bobotie_2.jpg" alt="Bobotie"><img src="https://www.recipetineats.com/wp-content/uploads/2020/04/Moroccan-Lamb-Tagine_2.jpg" alt="Tagine"><img src="https://www.196flavors.com/wp-content/uploads/2014/09/suya-4.jpg" alt="Suya"></div><div class="overlay"></div><div class="content"><h1>RateReflex</h1><p>experience food through professional eyes</p></div></div></body></html>
